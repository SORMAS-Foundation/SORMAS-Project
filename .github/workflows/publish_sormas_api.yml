---
name: Publish sormas-api to GitHub Packages

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 and Maven authentication
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish only sormas-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn -B -ntp -f sormas-api/pom.xml -Pgithub-packages
          "-Dgithub.packages.repository=https://maven.pkg.github.com/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          clean deploy
