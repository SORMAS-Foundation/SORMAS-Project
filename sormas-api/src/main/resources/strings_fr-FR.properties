# Default password
DefaultPassword.ownUserIntroduction=Vous venez de vous connecter en utilisant le mot de passe par défaut pour cet utilisateur. Ce mot de passe n'est pas sécurisé, car il pourrait être utilisé par des tiers non autorisés pour accéder à votre compte. Veuillez vous assurer de changer votre mot de passe dès que possible.
DefaultPassword.otherUsersIntroduction=Votre installation de SORMAS a activé les identifiants par défaut, qui ont été créés automatiquement lors de l'installation. Ces identifiants ont des mots de passe par défaut non sécurisés, qui peuvent être utilisés par des tiers non autorisés pour accéder à ces comptes. Veuillez vous assurer de changer les mots de passe par défaut de tous les utilisateurs concernés dès que possible, ou de supprimer entièrement les comptes, s'ils ne sont plus nécessaires. 
DefaultPassword.ownUserAction=En cliquant sur le bouton suivant, un nouveau mot de passe aléatoire sera généré et assigné à votre compte. Le nouveau mot de passe s'affichera ci-dessous.
DefaultPassword.otherUsersAction=En cliquant sur le bouton GÉNÉRER DE NOUVEAUX MOTS DE PASSE , de nouveaux mots de passe aléatoires seront générés et attribués à chacun des comptes utilisateur sélectionnés. Les nouveaux mots de passe seront affichés ci-dessous à côté de l'utilisateur correspondant.
DefaultPassword.ownUserNewPasswordSetHints=Votre compte a été mis à jour avec succès. Assurez-vous de copier votre nouveau mot de passe et de le garder en sécurité. Ce nouveau mot de passe ne s'affiche qu'une seule fois.
DefaultPassword.otherUsersNewPasswordSetHints=Vos comptes ont été mis à jour avec succès. Assurez-vous de copier les nouveaux mots de passe et d'informer les utilisateurs concernés du changement de mot de passe. Les nouveaux mots de passe ne s'affichent qu'une seule fois.
