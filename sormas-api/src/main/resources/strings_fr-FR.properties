# Info texts
infoActivityAsCaseInvestigation = <i>Veuillez documenter toutes les activités pertinentes après l'infection \:</i>
infoAddTestsToSample = Pour ajouter un résultat de test à cet échantillon, il doit d'abord être marqué comme reçu.
infoArchivedCases = Les cas sont automatiquement archivés après %d jours sans modification des données.
infoArchivedContacts = Les contacts sont automatiquement archivés après %d jours sans modification des données.
infoArchivedEvents = Les événements sont automatiquement archivés après %d jours sans modification des données.
infoArchivedEventParticipants = Les participants à l'événement sont automatiquement archivés après %d jours sans modification des données.
infoArchivedTravelEntries = Les entrées de voyage sont automatiquement archivées après %d jours sans modification des données.
infoAssigneeMissingEmail = L'utilisateur assigné à cette tâche n'a pas d'adresse e-mail et ne sera donc pas notifié.
infoObserverMissingEmail = Au moins un des observateurs de cette tâche n'a pas d'adresse e-mail fournie, et ne sera donc pas notifié.
infoAssigneeMissingEmailOrPhoneNumber = L'utilisateur assigné à cette tâche n'a pas d'adresse e-mail ni de numéro de téléphone et ne sera donc pas notifié.
infoAutomaticDeletion = Suppression prévue pour %s
infoAutomaticDeletionTooltip = Suppression prévue pour %s<hr>%s \: %s<br>Période de suppression \: %s
infoAutomaticDeletionTooltipDays = %s jours
infoAutomaticDeletionTooltipMonths = %s mois
infoAutomaticDeletionTooltipYears = %s années
infoObserverMissingEmailOrPhoneNumber = Au moins un des observateurs de cette tâche n'a pas d'adresse e-mail ni de numéro de téléphone fourni, et ne sera donc pas notifié.
infoBasicExport = Exporter les colonnes et les lignes affichées dans la table ci-dessous.
infoCanceledBy = Annulé en %s utilisant l'action en bloc
infoCaseDate = Par défaut, les cas sont filtrés en fonction de la date la plus pertinente disponible\: <br/><ul><li> Date de début des symptômes </li><li> Date du rapport de cas </li></ul> Cela signifie que, lorsqu'un cas par exemple a une date de début des symptômes, seule cette date sera prise en compte lors de la recherche dans la liste des cas dans la plage de dates spécifiée. Vous pouvez spécifier un type de date dans le menu déroulant pour filtrer spécifiquement à cette date. <br/><br/><b> Exemple\: </b> Le cas A a été créé cette semaine et a donc une date de rapport qui se situe dans cette semaine aussi. Toutefois, le cas A a également une date de début des symptômes définie sur la semaine dernière (car elle a été entrée de manière rétrospective). Par défaut, lorsque "Date la plus pertinente" est sélectionné et que vous avez défini le filtre pour afficher uniquement les observations de cette semaine, le cas A n'apparaîtra pas dans la liste car sa date d'apparition des symptômes est la semaine précédente. Pour que le cas apparaisse dans la liste, vous devez sélectionner "Date du rapport du cas". Seule la date du rapport sera prise en compte lors du filtrage de la liste.
infoCaseIncidence = « proportion d'incidence de cas » désigne le nombre de cas par 100 000 habitants. Vous pouvez consulter la touche de la carte pour voir les seuils qui définissent la colorisation des districts.
infoCaseMap = Si les cas sont affichés par adresse de domicile et qu'il n'y a pas de coordonnées GPS disponibles, les coordonnées de l'emplacement où le cas a été signalé sont utilisées à la place.
infoCheckProbableInfectionEnvironment = Cette case à cocher doit être cochée si vous êtes sûr que cette exposition était l'environnement d'infection le plus probable dans ce cas. Une seule exposition peut être considérée comme l'environnement d'infection probable en même temps et cette exposition sera transmise à SurvNet.
infoContactDashboard = Tous les éléments du tableau de bord qui affichent des informations générales sur les contacts utilisent la période de suivi du contact respectif, à commencer par la date du rapport de contact.
infoConvertToCaseContacts = Il y a %s contacts supplémentaires %s de cette personne qui n'ont pas de cas associé. Voulez-vous définir le cas que vous venez de créer comme le cas résultant de certains ou de tous ces contacts ?
infoConvertToCaseContactsAndEventParticipants = Il y a %s contacts supplémentaires %s et %s participants supplémentaires à l'événement %s de cette personne qui n'ont pas de jeu de cas résultant. Voulez-vous définir le cas que vous venez de créer comme le cas résultant de certains ou de tous ces contacts et participants à l'événement ?
infoConvertToCaseEventParticipants = Il y a %s participants supplémentaires à l'événement %s de cette personne qui n'ont pas de jeu de cas résultant. Voulez-vous définir le cas que vous venez de créer comme le cas résultant de certains ou de tous ces participants ?
infoConvertToCaseSelect = Veuillez sélectionner les contacts et les participants à l'événement pour lesquels vous souhaitez définir le cas créé comme cas résultant.
infoCreateEntry = La base de données ne contient aucune entrée qui semble être similaire aux détails du message de laboratoire.<br/><br>Sélectionnez l'une des options et cliquez sur le bouton <i>Enregistrer</i> pour créer une nouvelle entrée pour la personne.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus.
infoCronSummaryDailyAt=S'exécute à %s tous les jours.
infoCronSummaryDisabled=Cette tâche est désactivée.
infoCronSummaryEveryNHours=S'exécute toutes les %s heures.
infoCronSummaryEveryNMinutes=S'exécute toutes les %s minutes.
infoCronSummaryHourlyAt=S'exécute chaque heure à \:%s.
infoDashboardIncidence = Les seuils sont calculés en utilisant des quartiles.
infoDatabaseExportTables = Veuillez sélectionner les tables de base de données que vous souhaitez exporter.
infoDefineOutbreaks = Cliquez sur un bouton pour définir quelles zones de santés de la province ont actuellement une épidémie de maladie spécifique.
infoDetailedExport = Exportez les lignes figurant dans le tableau ci-dessous avec un ensemble étendu de colonnes. Cela peut prendre un peu de temps.
infoDeterminedVaccinationStatusExplanation = Le statut vaccinal est automatiquement déterminé à partir des enregistrements d'immunisation au moment du signalement du cas.
infoDeterminedVaccinationStatusReadOnly = Ce champ est en lecture seule car la fonctionnalité de statut vaccinal déterminé est activée. Le statut vaccinal est automatiquement calculé à partir des données d'immunisation.
infoCaseManagementExport = Exporter les lignes affichées dans le tableau ci-dessous avec un ensemble de colonnes personnalisées qui sont pertinentes pour le processus de gestion des cas. Cela peut prendre un certain temps.
infoDisplayNetworkDiagram = Veuillez agrandir pour voir les chaînes de transmission des maladies
infoDocumentAlreadyExists = Un document avec le nom de fichier "%s" existe déjà. Êtes-vous sûr de vouloir le télécharger ?
infoDocumentAlreadyExistsCannotUploadAnotherOne = Un document avec le nom de fichier "%s" existe déjà. Vous ne pouvez pas en télécharger un second avec le même nom.
infoDocumentOverride = Un document avec le nom de fichier "%s" existe déjà. Écraser ?
infoDontShareCheckboxAlreadyShared = Le cas a déjà été partagé. Il ne peut pas être défini pour ne pas être partagé avec l'outil de rapport externe.
infoDoseCountFromNumberOfDoses = Utilise le nombre de doses si disponible
infoDoseCountFromVaccinationEntries = Sinon compte le nombre d'entrées de vaccination
infoDownloadDocumentTemplateImportGuide = Si c'est la première fois que vous téléchargez des modèles de documents dans SORMAS, nous vous recommandons vivement de lire d'abord le guide des modèles de documents.
infoDownloadEmailTemplateImportGuide = Si c'est la première fois que vous importez des modèles d'e-mail dans SORMAS, nous vous recommandons fortement de lire le guide des modèles auparavant.
infoDownloadExport = L'exportation est en cours de préparation. Cela peut prendre un certain temps.<br/>Vous pouvez fermer cette boîte de dialogue une fois le téléchargement terminé.
infoDownloadCaseImportTemplate = Vous pouvez utiliser ce modèle de fichier .csv pour amener vos données dans un format lisible par SORMAS. Faites-le à chaque fois que vous importez des données, n'utilisez jamais un fichier que vous avez téléchargé auparavant.
infoDownloadImportTemplate = Vous pouvez utiliser ce modèle de fichier .csv pour amener vos données dans un format lisible par SORMAS. Faites-le à chaque fois que vous importez des données, n'utilisez jamais un fichier que vous avez téléchargé auparavant.
infoDownloadErrorReport = S'il y a des lignes qui ne pouvaient pas être importées, vous serez proposé un fichier .csv contenant toutes ces lignes ainsi que les descriptions d'erreurs.
infoDownloadImportGuide = Si c'est votre première fois que vous importez des données dans SORMAS, nous vous recommandons fortement de lire le guide d'importation en premier.
infoEventParticipantAlreadyExisting = Pour cette personne, un participant de l'événement existe déjà dans cet événement. Vous pouvez soit continuer avec ce participant ou retourner à la sélection de l'événement.
infoEventResponsibleUserFilter = Le filtre d'utilisateur responsable nécessite qu'une province soit sélectionnée dans le filtre de province.
infoExistingImmunizationPeriod = Période de vaccination de l'immunisation existante
infoExpectedFollowUpUntilDateCase = La date de suivi prévue pour ce cas est basée sur son %s (%s)
infoExpectedFollowUpUntilDateContact = Le suivi attendu jusqu'à la date pour ce contact est basé sur son %s (%s)
infoExportNoFilters = <b>Attention \:</b> Aucun filtre n'a été sélectionné. L'exportation peut prendre un certain temps.
infoFacilityCsvImport = Nom d'un établissement configuré (nécessite FacilityType), OTHER_FACILITY (nécessite FacilityType et FacilityDetails) ou NO_FACILITY
infoFacilityNeedsDistrict = Veuillez définir un département afin de sélectionner un établissement.
infoFeatureConfiguration = Activer ou désactiver des fonctionnalités système optionnelles. Les modifications prennent effet immédiatement et s'appliquent à l'ensemble du serveur.
infoImmunizationPeriod = Période de vaccination de cette immunisation
infoImmunizationStatusAcquired = Seules les immunisations avec le statut acquis sont prises en compte
infoImmunizationValidFromClosest = Sélectionne l'immunisation avec la date de début de validité la plus proche (mais pas après) de la date de signalement du cas
infoImmunizationValidUntilNotBefore = la date de fin de validité ne doit pas être antérieure à la date de signalement du cas
infoImportAllCountries = Ceci importera tous les pays qui sont actuellement membres de l'OMS. Vous recevrez une notification lorsque le processus d'importation sera terminé.
infoImportAllContinents = Ceci importera tous les continents par défaut. Vous recevrez une notification lorsque le processus d'importation sera terminé.
infoImportAllSubcontinents = Cela importera tous les sous-continents par défaut. Vous recevrez une notification lorsque le processus d'importation sera terminé.
infoImportCsvFile = Selon le nombre de lignes que vous souhaitez importer, cela peut prendre un certain temps. Vous recevrez une notification lorsque le processus d'importation est terminé.
infoImportInfrastructureAllowOverwrite = Sélectionnez cette option si les données existantes doivent être remplacées par des données du fichier d'importation. Si une entrée existante (basée sur le nom ou ISO/UNO-Code si disponible) est trouvée, toutes les données seront mises à jour avec le contenu du fichier d'importation (si disponible). Si aucune entrée existante n'est trouvée, une nouvelle entrée sera créée.
infoImportProcess = %d lignes sont en cours d'importation. Le processus d'importation peut prendre un certain temps. <br/> Vous pourrez vérifier et résoudre les erreurs éventuelles une fois le processus d'importation terminé.
infoImportSimilarity = L'un des cas que vous avez essayé d'importer est similaire à un cas déjà existant dans la base de données SORMAS. Veuillez vérifier si le cas à importer est un double de l'un des cas dans la liste et, si oui, sélectionnez ce cas et confirmez.
infoLostToFollowUpBy = Défini sur perdu pour suivi en %s utilisant l'action en bloc
infoNoAdditionalTests = Aucun test supplémentaire n'a été créé pour cet échantillon
infoNoCasesFoundStatistics = Aucun cas n'a été trouvé pour les options de filtrage et de visualisation sélectionnées.
infoNoDiseaseSelected = Veuillez sélectionner une maladie pour afficher l'aperçu de l'immunisation.
infoCaseIncidenceNotPossible = Les provinces suivantes ont des données démographiques manquantes \:<br/><br/>%s.<br/><br/>Par conséquent, l'incidence des cas ne peut pas être calculée et le nombre de cas est affiché à la place.
infoCaseIncidenceMissingPopulationData = Les provinces et/ou zones de santés suivantes ont des données démographiques manquantes \:<br/><br/>%s.<br/><br/> La proportion d'incidence ne peut pas être calculée pour ces provinces et/ou zones de santés.
infoCaseIncidenceIncompatible = Aucune donnée de population n'est disponible pour les communautés et les établissements. L'incidence du cas ne peut pas être calculée et le nombre de cas est affiché à la place. Si vous souhaitez voir l'incidence d'un cas, veuillez supprimer les filtres et les regroupements de la communauté et des établissements.
infoNoPathogenTests = There are no tests for this sample.
infoNoCaseLabResultsTests = Aucun test n'a été effectué pour ce cas
infoNoCaseLabResultsSamples = Aucun échantillon n'a été collecté pour ce cas
infoPickOrCreateCase = Il y a des cas existants dans la base de données qui semblent très similaires à celui que vous êtes sur le point de créer. Veuillez consulter la liste des cas existants et vérifier que le cas que vous voulez créer n'est pas un double d'un d'entre eux. Si vous trouvez un cas qui est le plus probable que le vôtre, cliquez <b> dessus dans la liste </b> et confirmez.
infoPickOrCreateCaseNewCase = Informations de cas récemment ajoutées
infoPickOrCreateImmunization = Le système contient déjà au moins une immunisation pour %s pour cette personne et ce moyen d'immunisation qui chevauche la période d'immunisation spécifiée. Veuillez comparer l'immunisation existante la plus récente avec celle que vous avez créée et décider si vous souhaitez ignorer la nouvelle immunisation, utiliser ses informations pour mettre à jour l'existante, ou la créer quand même.
infoPickOrCreateImmunizationExisting = Informations d'immunisation existantes
infoPickOrCreateImmunizationNew = Informations d'immunisation nouvellement ajoutées
infoPickOrCreatePathogenTest = La base de données contient déjà au moins un échantillon qui semble très similaire aux détails du message de laboratoire.<br/><br/>Veuillez consulter les listes d'échantillons. Si vous êtes certain de correspondre aux détails du message de laboratoire, sélectionnez-le et cliquez sur le bouton <i>Enregistrer</i> . Sinon, cliquez sur <i>Créer un nouvel exemple</i> pour créer un nouvel exemple pour l'entrée.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus.
infoPickOrCreateSample = Veuillez choisir l'une des options ci-dessous.<br/><br/>La liste des échantillons correspondants contient des échantillons dans la base de données qui semblent être similaires aux détails du message de laboratoire (le cas échéant).<br/>La liste des différents échantillons contient des échantillons liés à l'entrée que vous avez choisie, mais non similaires aux détails du message de laboratoire (le cas échéant).<br/>Vous pouvez également créer un nouvel échantillon.<br/><br/>Si vous n'êtes pas sûr , vous pouvez supprimer cette fenêtre et annuler le processus.
infoSampleAdditionalTesting = Veuillez cocher chaque type de test supplémentaire que vous souhaitez effectuer sur cet échantillon.
infoSampleExport = Exportez les exemples de toutes les observations affichées dans les lignes de la table avec un ensemble étendu de colonnes. Cela peut prendre un peu de temps.
infoSamplePathogenTesting = Veuillez cocher chaque type de test pathogène que vous souhaitez effectuer sur cet échantillon.
infoSimilarImmunization = Le système contient déjà au moins une vaccination pour %s pour cette personne et des moyens de vaccination qui chevauchent la période de vaccination spécifiée. Souhaitez-vous toujours mettre à jour les dates de début et de fin ou revenir en arrière et ajuster vos modifications ?
infoStatisticsDisclaimer = Toutes les statistiques sur cette page sont des données agrégées de l’ensemble du pays. Cela inclut les cas pour lesquels vous n’avez pas l’autorisation d’évaluer et qui ne sont donc pas visibles dans le répertoire des cas.
infoStatisticsFilter = Ajouter des filtres pour restreindre les données agrégées.<br/>Si vous utilisez plusieurs filtres, seuls les cas qui passent toutes les restrictions seront agrégés.
infoStatisticsResults = Cliquez sur le bouton "Générer" pour créer une nouvelle table, une carte ou un graphique.
infoSurveillanceDashboard = La date d'apparition du premier symptôme est utilisée pour filtrer tous les éléments du tableau de bord qui affichent des cas (les statistiques "Nouveaux Cas", la courbe épidémiologique et la carte de statut des cas) . A défaut, la date du rapport sera utilisée.
infoCampaignsDashboard=Tous les éléments du tableau de bord qui affichent les diagrammes de campagne.
infoUploadDocumentTemplate=Sélectionnez un modèle de document "%s" que vous souhaitez télécharger.
infoUserEmail = Utilisé pour envoyer des notifications par e-mail.
infoUserPhoneNumber = Utilisé pour envoyer des notifications par SMS. Doit contenir un code de pays.
infoVaccinationDoseCount = Détermine le nombre de doses à partir des enregistrements d'immunisation (une dose ou deux doses)
infoWeeklyReportsView = Le <b>Nombre de rapports d'agents/informateurs</b> désigne le nombre total des rapports qui ont été soumis par les agents ou informateurs de la province ou par l'agent de service au cours de la semaine sélectionnée.<br/><br/> Le <b>Pourcentage</b> est le pourcentage d'agents/d'informateurs qui ont soumis un rapport cette même semaine.<br/><br/> Le<b>Nombre de rapports zéro</b> est le nombre de ces rapports ne mentionnant aucun cas. Ceux-ci sont comptabilisés dans le nombre total de rapports.<br/><br/> L'en-tête <b>Soumis par l'agent/l'informateur le</b> désigne la date de soumission du rapport ou indique qu'aucun rapport n'a été soumis au cours de la semaine sélectionnée.
infoMergingExplanation = Cette vue est conçue pour vous aider à détecter et à fusionner les cas dupliqués. Les cas sont toujours affichés par paires, le cas avec la date de création la plus ancienne étant en haut. <br/> <br/> Vous pouvez utiliser le filtre de date de création pour afficher uniquement les doublons potentiels créés au cours d'une période donnée. La date de création est automatiquement générée lors de la saisie d'un cas dans SORMAS et ne peut pas être modifiée par les utilisateurs. Par conséquent, une fois que vous avez examiné tous les doublons d'une période spécifique dans le passé, vous ne devrez plus jamais le refaire, car aucun nouveau cas ne sera créé pendant cette période. <br/> <br/> Veuillez noter que la plupart des probablement pas tous les cas affichés sont des doublons réels. Il existe un risque de faux positifs. <B> veuillez donc examiner attentivement les cas avant de les fusionner\! </ B> En plus des informations fournies dans le tableau, vous pouvez également cliquer sur les ID des cas pour les ouvrir dans un nouvel onglet. Gardez à l'esprit qu'il est bien pire de fusionner faussement des cas uniques que d'avoir des doublons dans le système.
infoContactMergingExplanation = Cette vue est conçue pour vous aider à détecter et à fusionner des contacts en double. Les contacts sont toujours affichés sous forme de paires, le contact avec la date de création antérieure étant en haut.<br/><br/>Vous pouvez utiliser le filtre de date de création pour voir uniquement les doublons potentiels qui ont été créés dans une période spécifique de temps. La date de création est automatiquement générée lorsqu'un contact est entré dans SORMAS et ne peut pas être modifié par les utilisateurs. Par conséquent, une fois que vous avez examiné tous les doublons d'une période spécifique dans le passé, vous n'aurez plus jamais à le faire car il n'y aura pas de nouveaux contacts créés pendant ce laps de temps.<br/><br/>Veuillez noter que tous les contacts affichés ne sont probablement pas des doublons réels. Il y a un potentiel de faux positifs, donc <b>veuillez vérifier attentivement les contacts avant de les fusionner \!</b> En plus des informations fournies dans le tableau, vous pouvez également cliquer sur les identifiants des contacts pour les ouvrir dans un nouvel onglet. Gardez à l'esprit qu'il est bien pire de fusionner faussement des contacts uniques que d'avoir des doublons dans le système.
infoMergingMergeDescription = Choisissez cette option uniquement si vous êtes <b> sûr que les deux cas sont identiques\!</b> Vous devez cliquer sur ce bouton à côté du cas contenant les informations les plus récentes ou les plus complètes. Cliquez sur les identifiants des cas pour les ouvrir dans de nouveaux onglets afin de voir toutes leurs données. Lorsque le cas que vous avez choisi manque des informations présentes dans l'autre cas, il sera mis à jour. En outre, les contacts, les échantillons, les tâches et les informations de gestion de cas seront transférés. Ensuite, le cas que vous n'avez pas choisi sera supprimé.
infoContactMergingMergeDescription = Choisissez cette option seulement si vous êtes <b>sûr que les deux contacts sont les mêmes \!</b> Vous devez cliquer sur ce bouton à côté du contact avec les informations les plus récentes ou plus complètes. Cliquez sur les identifiants des contacts pour les ouvrir dans de nouveaux onglets afin de voir toutes leurs données. Lorsque le contact que vous avez choisi manque d'informations présentes dans l'autre contact, il sera mis à jour. De plus, des échantillons, des tâches et des informations de gestion des contacts seront transférés. Ensuite, le contact que vous n'avez pas choisi sera supprimé.
infoMergingPickDescription = Cliquer sur ce bouton supprimera simplement le cas qui n'a pas été choisi. Cependant, aucune information ne sera copiée dans le cas où il reste actif. Tous les contacts, échantillons et tâches seront également perdus. Choisissez cette option si vous êtes sûr que les deux cas sont les mêmes, mais l'autre cas n'a pas été mis à jour avec toute information qui doit être transférée à celle qui reste active.
infoContactMergingPickDescription = En cliquant sur ce bouton, vous supprimerez simplement le contact qui n'a pas été sélectionné. Cependant, aucune information ne sera copiée vers le contact qui reste actif. Tous les échantillons et tâches seront également perdus. Choisissez cette option si vous êtes sûr que les deux contacts sont les mêmes, mais l'autre contact n'a pas été mis à jour avec les informations qui doivent être transférées à celui qui reste actif.
infoMergingHideDescription = Choisissez cette option si vous n'êtes pas sûr que les deux cas sont les mêmes ou si vous savez qu'ils ne sont pas. Cela masquera la paire de cas de la liste. Veuillez noter que lorsque vous rafraîchissez la vue ou revenez à celle-ci plus tard, elle apparaîtra aussi longtemps que vous ne choisissez pas une période de temps différente dans le filtre de date de création.
infoContactMergingHideDescription = Choisissez cette option si vous ne savez pas si les deux contacts sont les mêmes ou si vous savez qu'ils ne le sont pas. Ceci masquera la paire de contacts de la liste. Veuillez noter que lorsque vous rafraîchissez la vue ou que vous y revenez plus tard, il réapparaîtra tant que vous ne choisissez pas une autre période de temps dans le filtre de date de création.
infoPersonMergeDescription = Veuillez sélectionner l'une des personnes ci-dessous comme personne principale. Vous disposez des options suivantes pour continuer.<br/> Fusion \: les données de la personne supprimée seront liées et/ou ajoutées à la personne restante, mais pas écrasées. Vous ne pourrez pas annuler cette action.<br/> Choisissez \: les données de la personne restante ne seront pas modifiées et les données de l'autre personne seront supprimées. Cependant, les entités liées à la personne rejetée seront liées à la personne restante. Vous ne pourrez pas annuler cette action.
infoPersonMergeConfirmation = Êtes-vous sûr de vouloir faire cela ? L'action n'est pas réversible
infoPersonMergeConfirmationBothShared = Les personnes que vous souhaitez fusionner ont toutes deux des entités partagées via S2S. Si vous fusionnez ces personnes, la synchronisation sera rompue pour la personne qui n'est pas la personne principale et les entités associées. Veuillez discuter avec votre administrateur si vous souhaitez faire cela et vérifier laquelle des deux personnes vous souhaitez avoir comme personne principale.<br/><bt/>Êtes-vous certain de vouloir faire cela ? L'action n'est pas réversible.
infoPersonMergeSharedMustLead = Veuillez noter que vous ne pouvez pas choisir cette personne comme personne principale car la synchronisation S2S serait alors rompue.\nVeuillez sélectionner l'autre personne comme personne principale
infoPickEventParticipantsForPersonMerge = Les personnes sélectionnées ont toutes deux un participant à l'événement dans au moins un événement. La fusion des personnes entraînerait des participants à l'événement en double.<br/> Pour chaque événement, veuillez sélectionner l'un des participants à l'événement ci-dessous comme participant à l'événement principal.<br/> 'Fusionner' \: Le participant à l'événement rejeté sera retiré de l'événement. Ses entités et informations associées seront liées et/ou ajoutées au participant à l'événement restant, mais ne seront pas écrasées. Vous ne pourrez pas annuler cette action.<br/> 'Sélectionner' \: Le participant à l'événement rejeté sera retiré de l'événement. Ses entités et informations associées ne seront pas liées et/ou ajoutées au participant à l'événement restant. Vous ne pourrez pas annuler cette action.
infoPickorMergeEventParticipantDuplicateEventParticipantByPersonByEvent = Une des personnes sélectionnées a plusieurs participants à l'événement actifs ou archivés dans le même événement(s).<br/>Veuillez examiner les événements avec les UUID présentés ci-dessous et supprimer les participants à l'événement en double ou demander à un superviseur de le faire afin de pouvoir fusionner ces personnes.
infoPersonMergeConfirmationForNonSimilarPersons = Les deux personnes sélectionnées ne correspondent pas aux exigences de similarité utilisées par SORMAS pour détecter les personnes en double. Veuillez vous assurer que les personnes sélectionnées sont effectivement identiques et censées être fusionnées avant de continuer.
infoExternalMessageCaseDataMismatch=Le cas sélectionné contient des informations de données de cas qui ont peut-être été modifiées par l'utilisateur.<br/>Certaines valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoExternalMessageCaseHealthConditionsMismatch=Le cas sélectionné contient des données de conditions de santé qui ont peut-être été modifiées par l'utilisateur.<br/>Certaines valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoExternalMessageCaseSymptomsMismatch = Le cas sélectionné contient des données de symptômes qui ont peut-être été modifiées par l'utilisateur.<br/>Les valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoExternalMessageCaseSymptomsMismatchExistingCaseSymptoms = Symptômes de cas existants \: %s
infoExternalMessageCaseSymptomsMismatchExternalMessageSymptoms = Symptômes du message externe \: %s
infoExternalMessageCaseHospitalizationMismatch = Le cas sélectionné contient des données d'hospitalisation qui ont peut-être été modifiées par l'utilisateur.<br/>Les valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoExternalMessageCaseExposuresMismatch = Le cas sélectionné contient des données d'exposition qui ont peut-être été modifiées par l'utilisateur.<br/>Les valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoExternalMessageCaseActivitiesAsCaseMismatch = Le cas sélectionné contient des activités en tant que données de cas qui ont peut-être été modifiées par l'utilisateur.<br/>Les valeurs entrantes ne seront pas transférées.<br/>Souhaitez-vous continuer ?
infoHowToMergeCases = Vous pouvez choisir entre deux options lors de l'examen de cas potentiellement doublons \:
infoHowToMergeContacts = Vous pouvez choisir entre deux options lors de l'examen de contacts potentiellement dupliqués \:
infoCalculateCompleteness = Le bouton <i>Calculer la complétude</i> en haut peut être utilisé pour calculer les valeurs de complétude pour tous les cas dans le tableau. Cette opération n'est nécessaire que s'il y a des cas dans la liste qui n'ont pas encore une valeur complète. Normalement, cette valeur est automatiquement mise à jour chaque fois que les détails d'un cas ou d'un de ses contacts ou échantillons changent.
infoContactCalculateCompleteness = Le bouton <i>Calculer la complétude</i> sur le dessus peut être utilisé pour calculer les valeurs de complétude de tous les contacts du tableau. Ce n'est nécessaire que s'il y a des contacts dans la liste qui n'ont pas encore une valeur complète. Normalement, cette valeur est automatiquement mise à jour chaque fois que les détails d'un contact ou d'un de ses échantillons changent.
infoCaseCompleteness = La complétude est une mesure de la quantité de données vitales qui ont déjà été saisies dans le cas. Elle se compose des éléments suivants, pondérés par leur importance\:<br/><ul><li>Le cas a-t-il été classé?</li><li>Le cas a-t-il été investigué?</li><li>A-t-on prélevé au moins un échantillon?</li><li>A-t-on documenté au moins un symptôme?</li><li>A-t-on créé au moins un contact ? </li><li>Y a-t-il un résultat pour le cas? </li><li>Le cas a-t-il une date de naissance ou un âge? </li><li>Le cas a-t-il un sexe? </li><li>Une date de début a-t-elle été spécifiée? </li></ul>
infoContactCompleteness = L'exhaustivité est une mesure de la quantité de données vitales déjà entrées dans le contact. Ceci est composé des éléments suivants, pondérés par leur importance \:<br/><ul><li>Le contact a-t-il été classé ?</li><li>Le statut du contact a-t-il été modifié ?</li><li>Y a-t-il au moins un échantillon ?</li><li>Le contact a-t-il une date de dernier contact spécifiée ?</li><li>Est-ce que le contact a un rapport sexuel?</li><li>Est-ce que la relation est spécifiée ?</li><li>Le contact a-t-il une catégorie spécifiée ?</li><li>Le contact a-t-il sa date de naissance ?</li></ul>
infoCompletenessMerge = Vous pouvez utiliser cette mesure pour vous faire une idée du cas que vous devriez utiliser comme celui qui reste actif lors d'une fusion. Toutefois, assurez-vous de toujours examiner les deux cas en détail afin d'éviter les erreurs.
infoContactCompletenessMerge = Vous pouvez utiliser cette mesure pour avoir une idée du contact que vous devez utiliser comme celui qui reste actif lors de la fusion. Toutefois, veuillez vous assurer que vous avez toujours un examen détaillé des deux contacts pour éviter les erreurs.
infoMergeIgnoreRegion = La sélection de cette option exclut la province en tant que critère de détection des doublons. La fusion et la sélection sont désactivées ici car la probabilité d'une duplication réelle au-delà des limites de la province est très faible. Si un doublon réel est détecté, ce cas peut être supprimé manuellement via le répertoire des cas.
infoContactMergeIgnoreRegion = La sélection de cette option exclut la province en tant que critère de détection des doublons. La fusion et la cueillette sont désactivées ici parce que la probabilité d'un véritable double au-delà des frontières de la province est très faible. Si un vrai doublon est détecté, ce contact peut être supprimé manuellement via le répertoire des contacts.
infoCustomExport = Dans cette vue, vous pouvez créer et enregistrer des configurations d'exportation avec des ensembles de colonnes personnalisés. La sauvegarde de ces configurations vous permet d'exporter rapidement les informations qui vous intéressent, sans devoir modifier manuellement le fichier CSV qui en résulte. Veuillez cliquer sur le bouton d'export en bleu à côté de l'une de vos configurations ou créer une nouvelle configuration en utilisant le bouton à droite.
infoEditExportConfiguration = Chacune des cases à cocher ci-dessous représente une colonne dans le fichier d'exportation. Veuillez sélectionner toutes les colonnes que vous souhaitez voir apparaître dans votre exportation personnalisée et désélectionnez celles dont vous n'avez pas besoin.
infoPopulationDataView = Utilisez l'un des boutons ci-dessous pour gérer les données de population pour les provinces et les zones de santés de SORMAS. Si vous souhaitez modifier les données, utilisez la fonction d'exportation, copiez les données à modifier dans le modèle d'importation, modifiez-les et importez le fichier de modèle contenant les données modifiées.
infoPopulationCollectionDate = Veuillez indiquer la date à laquelle les données de population que vous souhaitez importer ont été collectées. Si vous ne connaissez que l'année, veuillez choisir le 1er janvier de cette année.
infoPopulationReferenceYear = Les proportions d'incidence des cas sont calculées soit en projetant les données de population en %s, qui est l'année maximale qui a été sélectionnée dans les filtres, soit en prenant les données de population originales si l'année maximale sélectionnée est antérieure à l'année de collecte des données de population.
infoLineListingConfigurationRegion = La liste ligne est activée pour toutes les zones de santé répertoriées à côté de la maladie. Cliquez sur le bouton <b>Modifier la liste de ligne</b> sous un nom de maladie pour configurer la liste de ligne pour toutes les zones de santé.
infoLineListingConfigurationNation = Cliquez sur une province pour ouvrir une vue détaillée avec des informations de liste de ligne pour toutes ses zones de santés. Cliquez sur le bouton <b>Modifier la liste des lignes</b> sous une maladie pour configurer la liste des lignes pour toutes les provinces.
# 1st %s: disease name; 2nd %s: region name
infoLineListingConfigurationRegionEdit = Vous êtes en train de modifier la configuration de la liste des cas provincial pour <b>%s</b> dans <b>%s</b>.
# %s: disease name
infoLineListingConfigurationNationEdit = Vous modifiez la configuration de la liste des cas à l'échelle nationale pour <b>%s</b>.
infoNoNetworkDiagram = Veuillez sélectionner une maladie ci-dessus pour voir les chaînes de transmission de la maladie.
infoOtherImmunization = Autres moyens d'immunisation (par exemple, traitements expérimentaux)
infoSyncUsers = Synchroniser les données des utilisateurs de SORMAS avec le fournisseur d'authentification externe configuré. <br/> La synchronisation se fait <b>dans un seul sens</b> SORMAS -> Fournisseur d'authentification. <br/> Les mots de passe ne sont pas mis à jour pour les utilisateurs qui existent déjà dans le fournisseur d'authentification externe
infoSpecificCaseSearch = Utilisez le champ de texte ci-dessous pour rechercher un cas spécifique dans tout le pays. Vous pouvez rechercher par ID de cas, ID externe ou numéro d'épidémie. Cliquez sur "Recherche de cas" lorsque vous avez terminé pour ouvrir le cas si la recherche a réussi. Si plusieurs cas sont trouvés, le cas avec la date la plus récente du rapport sera ouvert.
infoSpecificEventSearch = Utilisez le champ de texte ci-dessous pour rechercher un cas spécifique dans tout le pays. Vous pouvez effectuer une recherche par ID de cas, ID externe ou numéro d'EPID. Cliquez sur "Rechercher un cas" lorsque vous avez terminé pour ouvrir le cas si la recherche a réussi.<br/><br/>Si plus d'un cas est trouvé, le cas avec la dernière date de rapport sera ouvert.
infoSearchCaseForContact = Utilisez le champ de texte ci-dessous pour rechercher n'importe quel cas dans le système auquel vous avez accès. Vous pouvez effectuer une recherche par nom, par ID de cas, par ID externe ou par numéro Epid. Lorsque vous avez terminé, cliquez sur "Rechercher un cas" pour voir une liste de tous les cas qui correspondent au texte que vous avez saisi. Sélectionnez un cas dans cette liste et cliquez sur "Confirmer" pour utiliser le cas sélectionné comme cas source du contact.
infoNoSourceCaseSelected = Veuillez sélectionner le cas source pour ce contact, si connu
infoNoSourceCaseSelectedLineListing = Veuillez sélectionner le cas source, si connu
infoContactCreationSourceCase = <b>Cas source sélectionné \:</b><br/>%s
infoSelectOrCreateContact = La base de données contient déjà au moins un contact qui semble être très similaire aux détails du contact créé.<br/><br/>Veuillez consulter la liste des contacts. Si vous êtes certain de correspondre à votre contact, sélectionnez-le et cliquez sur le bouton <i>Enregistrer</i> . Sinon, cliquez sur <i>Créer un nouveau contact</i> pour créer un nouveau contact pour la personne.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus de création de contact.
infoSelectOrCreateContactImport = La base de données contient déjà au moins un contact qui semble être très similaire aux détails du contact importé.<br/><br/>Veuillez consulter la liste des contacts. Si vous êtes certain de correspondre à votre contact, sélectionnez-le et cliquez sur le bouton <i>Enregistrer</i> . Sinon, cliquez sur <i>Créer un nouveau contact</i> pour créer un nouveau contact pour la personne.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre pour supprimer le contact de l'importation courante.
infoSelectOrCreateEntry = La base de données contient déjà au moins une entrée qui semble être très similaire aux détails du message externe.<br/><br/>Veuillez consulter les listes d'entrées. Si vous avez la certitude qu'une correspond aux détails du message externe, sélectionnez-la et cliquez sur le bouton <i>Confirmer</i>. Sinon, sélectionnez une des autres options pour créer une nouvelle entrée pour la personne.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus.
infoSelectOrCreatePersonForContact = La base de données contient déjà au moins une personne qui semble être très similaire aux données personnelles du contact créé.<br/><br/>Veuillez consulter la liste des personnes. Si vous avez la certitude qu'une de ces personnes correspond à votre personne de contact, sélectionnez-la et cliquez sur le bouton <i>Enregistrer</i> . Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne pour votre contact.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus de création de contact.
infoSelectOrCreatePersonForImmunization = La base de données contient déjà au moins une personne qui semble être très similaire aux détails personnels de l'immunisation créée.<br/><br/>Veuillez consulter la liste des personnes. Si vous avez la certitude qu'une de ces personnes correspond à votre personne d'immunisation, sélectionnez-la et cliquez sur le bouton <i>Enregistrer</i>. Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne pour votre immunisation.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus de création de l'immunisation.
infoSelectOrCreatePersonForImport = La base de données contient déjà au moins une personne qui semble être très similaire aux détails personnels de l'entrée importée.<br/><br/>Veuillez consulter la liste des personnes. Si vous avez la certitude qu'une de ces personnes correspond à la personne de l'entrée importée, sélectionnez-la et cliquez sur le bouton <i>Enregistrer</i>. Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre pour retirer l'entrée de l'importation en cours.
infoSelectOrCreatePersonForEventParticipant = La base de données contient déjà au moins une personne qui semble être très similaire aux données personnelles du contact créé.<br/><br/>Veuillez consulter la liste des personnes. Si vous avez la certitude qu'une de ces personnes correspond à votre personne de contact, sélectionnez-la et cliquez sur le bouton <i>Enregistrer</i> . Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne pour votre contact.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus de création de contact.
infoSelectOrCreatePersonForLabMessage = La base de données contient déjà au moins une personne qui semble être très similaire aux détails personnels du message externe.<br/><br/>Veuillez consulter la liste des personnes. Si vous avez la certitude qu'une de ces personnes correspond à la personne du message externe, sélectionnez-la et cliquez sur le bouton <i>Confirmer</i>. Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne pour le message.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus.
infoSelectOrCreatePersonForLabMessageWithoutMatches = Une personne correspondant étroitement aux détails de la personne du message externe n'a pas pu être déterminée automatiquement.<br/><br/>Vous pouvez rechercher manuellement des correspondances, ou vous pouvez créer une nouvelle personne. Une fois que vous avez sélectionné une option, continuez via le bouton <i>Confirmer</i>.<br/><br/>Si vous n'êtes pas sûr, vous pouvez supprimer cette fenêtre et annuler le processus.
infoSkipOrOverrideDuplicateCampaignFormDataImport = La base de données contient déjà un jeu de données pour le formulaire %s dans la campagne %s pour la communauté et la date spécifiées. Veuillez consulter les détails du jeu de données existant et choisir <i>Ignorer</i> si vous voulez conserver les données existantes ou <i>Écraser</i> si vous voulez remplacer les données existantes par les données que vous avez importées.
pseudonymizedCasesSelectedWarning = Pour les cas gérés en bloc, vous n'avez qu'un accès limité aux données sensibles. Dans ces cas, la valeur que vous mettez dans "Place Description" sera ignorée.
pseudonymizedEntitiesSelectedWarning = Vous n'avez qu'un accès limité à certaines des entités sélectionnées. Veuillez désélectionner les entités pseudonymées pour continuer.
infoPickOrCreateEventForCase = La liste ci-dessous contient tous les événements existants ayant la même maladie que le cas actuel. Veuillez vérifier si l'événement auquel appartient ce cas est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEventForCases = La liste ci-dessous contient tous les événements existants ayant la même maladie que les cas sélectionnés. Veuillez vérifier si l'événement auquel appartiennent ces cas est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEventForContact = La liste ci-dessous contient tous les événements existants ayant la même maladie que le contact actuel. Veuillez vérifier si l'événement auquel appartient ce contact est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEventForContacts = La liste ci-dessous contient tous les événements existants ayant la même maladie que les contacts sélectionnés. Veuillez vérifier si l'événement auquel appartiennent ces contacts est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEventForLabMessage = La liste ci-dessous contient tous les événements existants ayant la même maladie que le cas actuel. Veuillez vérifier si l'événement auquel appartient ce cas est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateSuperordinateEventForEvent = La liste ci-dessous contient tous les événements existants avec une date d'événement et la même maladie que l'événement en cours. Veuillez vérifier si l'événement superordonné pour cet événement est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEnvironmentForEvent = La liste ci-dessous contient tous les environnements existants avec une date signalée. Veuillez vérifier si l'environnement pour cet événement est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoPickOrCreateEventGroupForEvent = La liste ci-dessous contient tous les groupes d'événements existants. Veuillez vérifier si le groupe d'événements auquel appartient cet événement est déjà dans cette liste ou en créer un nouveau s'il ne l'est pas.
infoSelectOrCreatePersonForCase = La base de données contient déjà au moins une personne qui semble être très similaire aux données personnelles du cas créé.<br/><br/>Veuillez consulter la liste des personnes. Si vous êtes certain qu'une de ces personnes correspond à la personne de votre cas, sélectionnez-les et cliquez sur le bouton <i>Sauvegarder</i>. Sinon, cliquez sur <i>Créer une nouvelle personne</i> pour créer une nouvelle personne pour votre cas.<br/><br/>Si vous n'êtes pas sûr, vous pouvez fermer cette fenêtre et annuler le processus de création du cas.
infoSearchPerson = Utilisez les filtres ci-dessous pour rechercher toute personne dans le système à laquelle vous avez accès, en fonction de \: Prénom, Nom, UUID de la personne, ID externe, Jeton externe. Lorsque vous avez terminé, cliquez sur "Rechercher" pour voir une liste de personnes qui correspondent au texte que vous avez saisi. Sélectionnez la personne dans la liste et cliquez sur "Confirmer" pour choisir la personne sélectionnée.
infoContactsViewRegionDistrictFilter = Lorsque vous sélectionnez un filtre de province et/ou de zone de santé, l'annuaire des contacts est principalement filtré par la province et la zone de santé responsables des contacts. Si elles ne sont pas remplies, la province et la zone de santé du cas source du contact sont utilisés à la place.
infoDeveloperOptions = Vous pouvez utiliser les commandes ci-dessous pour générer des cas factices et des contacts en fonction des contraintes sélectionnées. Veuillez noter que la génération de nombreuses données à la fois peut prendre un certain temps.<br>Les données générées ne sont ni totalement déterministes, ni entièrement aléatoires, et ne sont destinées qu'à des fins de test et de démonstration.
infoDeveloperOptionsContactGeneration = Lors de la génération de contacts, le générateur choisira des cas existants aléatoirement comme source. Veuillez vous assurer que la base de données de cas n'est pas vide avant de générer des contacts.
infoDeveloperOptionsSeedUsage = L'utilisation de la graine (seed) créera des ensembles de données identiques, à condition que les conditions de départ (configuration et base de données) soient également identiques
infoCreateNewSampleDiscardsChangesCase = La création d'un nouvel échantillon supprimera toutes les modifications non enregistrées apportées à ce cas
infoCreateNewSampleDiscardsChangesContact = La création d'un nouvel échantillon supprimera toutes les modifications non enregistrées apportées à ce contact
infoCreateNewSampleDiscardsChangesEventParticipant = La création d'un nouvel échantillon éliminera toutes les modifications non sauvegardées apportées à ce participant à l'événement
infoUsageOfEditableCampaignGrids = Vous pouvez modifier les données de la campagne et les définitions du tableau de bord en cliquant à l'intérieur d'une des cellules de la grille, et vous pouvez réorganiser les éléments du tableau de bord en glissant et en déposant les lignes de la grille
infoSaveOfTask = L'enregistrement de cette tâche supprimera toutes les modifications non enregistrées apportées au cas.
populationDataByArea = Données de la population par zone
populationDataByRegion = Données de la population par province
populationDataByCommunity = Aucune donnée de population disponible pour les communautés
populationDataByDistrict = Données de la population par département
infoExposureInvestigation = <i>Veuillez documenter toutes les situations d'exposition directes pertinentes (ex\: participation à des rassemblements, voyages, contacts avec des animaux, etc.) pendant la période d'incubation \:</i>
infoExposureInvestigationContacts = <i>Veuillez documenter les informations sur l'exposition qui a conduit à ce contact \:</i>
infoExposurePeriodHeading = <i>Période d'exposition à prendre en compte \:</i>
infoEpiDataFieldsHint = Veuillez indiquer si le patient, pendant la période d'incubation a \: 
infoEpiDataSourceCaseContacts = Veuillez indiquer tous les contacts avec des cas sources potentiels pendant la période d'incubation\: 
infoNoSourceCase = Pas de cas source
infoCreateNewContactDiscardsChanges = La création d'un nouveau contact supprimera toutes les modifications non enregistrées apportées à ce cas
infoExposuresInfectionEnvironmentHint = Cette exposition est marquée comme l'environnement d'infection probable.
infoExposuresRiskAreaHint = Cette exposition a eu lieu dans une zone à risque.
infoUserSyncProcess = %d utilisateurs sont en cours de synchronisation avec le fournisseur d'authentification externe. Le processus d'importation peut prendre un certain temps.<br/>Vous pourrez vérifier et résoudre les erreurs éventuelles une fois le processus d'importation terminé.
infoNoSubordinateEvents=Aucun événement subordonné
infoNoSuperordinateEvent=Aucun événement supérieur
infoNoEventGroups=Aucun groupe d'événements
infoMergeFiltersHint = Le calcul et l'affichage de cas de doublons potentiels sont une tâche très complexe et peuvent nécessiter beaucoup de temps. Il est fortement recommandé d'ajuster les filtres au-dessus de cette vue pour réduire le nombre de cas détectés en même temps, par ex. en augmentant le seuil inférieur du filtre « Date de création », ou en sélectionnant des seuils pour la « Date de rapport ou de début ».<br/><br/>Lorsque vous voyez cet indice, le chargement des doublons a été temporairement bloqué pour vous assurer que vous pouvez ajuster les filtres. Cliquer sur "Confirmer les filtres" après cela affichera la liste des doublons potentiels.
infoPlaceOfStayInHospital = Veuillez sélectionner un hôpital comme lieu de séjour. Si le cas n'est pas actuellement admis dans un hôpital en tant que patient, veuillez documenter les hospitalisations sous les hospitalisations précédentes.
infoMoreDetailsAboutHospitalization = Pour plus de détails sur l'hospitalisation, allez dans l'onglet hospitalisation.
infoCountryNotEditableEventParticipantsWithoutJurisdiction = Le changement de pays n'est pas autorisé car au moins un participant à cet événement n'a pas de province responsable et/ou de zone de santé responsable définie.
infoContactAlreadyConvertedToCase = Ce contact a déjà été converti en un cas. Veuillez ajouter de nouvelles visites à la place.
infoSearchPersonOnDependentForm = Rechercher une autre personne
infoTasksWithMultipleJurisdictionsSelected = Vous avez sélectionné des tâches liées à différentes juridictions, ou qui sont liées à des données ne comportant pas d'informations sur l'établissement ou le point d'entrée. Seuls les utilisateurs de niveau %s ou supérieur seront sélectionnables comme destinataires.
infoNoAccessToPersonEntities = Vous n'avez pas les droits utilisateur nécessaires pour voir les entrées associées aux personnes.
infoDashboardFinalLaboratoryResult = Lorsqu'un cas a plusieurs échantillons, seul le résultat final de laboratoire de l'échantillon avec la date de collecte la plus récente est pris en compte.
infoBulkProcess = %d entrées sélectionnées sont en cours de traitement. Cela peut prendre un certain temps. La progression sera mise à jour pour chaque 20 entrées traitées.
infoBulkProcessFinished = <b>Toutes les entrées sélectionnées ont été traitées \!</b><br/>Vous pouvez maintenant fermer cette fenêtre.
infoBulkProcessFinishedWithIneligibleItems = <b>Le processus en lot a été complété avec succès \!</b><br/> Cependant, certaines des entrées sélectionnées n'ont pas pu être traitées, car elles n'étaient pas éligibles.
infoBulkProcessFinishedWithoutSuccess = <b>Le processus groupé s'est terminé sans succès \!</b><br/>Aucune des entrées n'a été traitée avec succès \!
infoBulkProcessFinishedWithSkips = <b>Le traitement en lot a été complété avec succès \!</b><br/>Cependant, certaines des entrées sélectionnées n'ont pas pu être traitées, probablement parce qu'ils étaient hors de votre juridiction, déjà archivés ou non admissibles.
infoBulkProcessFinishedWithSkipsOutsideJurisdictionOrNotEligible = <b>Le processus groupé a été complété avec succès \!</b><br/>Cependant, certaines des entrées sélectionnées n'ont pas pu être traitées, probablement parce qu'elles étaient hors de votre juridiction ou non éligibles.
infoBulkProcessNoEligibleEntries = <b>Le processus en lot a été annulé car il n'y a pas d'entrées éligibles pour cette opération \!</b>
infoBulkProcessCancelled = <b>Le processus groupé a été annulé \!</b><br/>Toutes les entrées sélectionnées jusqu'à ce point ont été traitées. Vous pouvez maintenant fermer cette fenêtre. Toutes les entrées non encore traitées resteront sélectionnées.
infoBulkUnresponsiveWindowHint = <b>Astuce \:</b> Si la barre de progression semble ne pas répondre et qu'aucun progrès n'est visible après un certain temps, essayez de cliquer sur cette fenêtre contextuelle ou de redimensionner votre fenêtre de navigateur.
infoCrowdinLocalization = Si vous souhaitez contribuer à la localisation de SORMAS dans différentes langues, vous pouvez le faire en devenant membre de notre projet Crowdin à <a href\="https\://crowdin.com/project/sormas" target\="_blank">https\://crowdin.com/project/sormas</a>
infoNoEnvironmentSamples = Aucun échantillon n'a été créé pour cet environnement
infoRecoveryNaturalImmunity = Immunité naturelle due à la guérison de la maladie
infoRestrictDiseasesDescription=Marquer toutes les maladies auxquelles l'utilisateur est censé avoir accès
infoNoCustomizableEnumTranslations = Cliquez sur le bouton + ci-dessous pour ajouter des traductions à cette valeur personnalisable.
infoNoCustomizableFieldTranslations = Cliquez sur le bouton + ci-dessous pour ajouter des traductions pour ce champ.
infoNoCustomizableFieldOptions = Cliquez sur le bouton + ci-dessous pour ajouter des options pour ce champ.
infoCustomizableEnumConfigurationInfo = Les enums personnalisables sont des ensembles de valeurs qui peuvent être personnalisés afin de répondre aux besoins individuels de votre pays ou à une situation épidémiologique spécifique. Le tableau sur cet écran contient toutes les valeurs personnalisables de la base de données. Chaque valeur est associée à un type de données, par exemple des variantes de maladie ou des types de profession. Certains de ces types de données ont des valeurs par défaut qui sont automatiquement ajoutées à la base de données lorsque SORMAS est configuré ou que de nouveaux types de données sont ajoutés au système.<br/><br/>Vous pouvez ajouter de nouvelles valeurs d'énumération ou modifier celles existantes, ajouter des traductions pour les langues prises en charge par SORMAS, sélectionner les maladies pour lesquelles la valeur doit être visible (par défaut, les valeurs personnalisables d'énum sont visibles pour toutes les maladies) et configurer des propriétés supplémentaires.<br/><br/>Les propriétés sont utilisées pour mieux contrôler le comportement des valeurs personnalisables. Par exemple, la propriété "a des détails" qui est prise en charge par la plupart des valeurs enum bascule si la sélection de cette valeur devrait faire apparaître un champ de texte supplémentaire auquel les utilisateurs peuvent ajouter plus d'informations.<br/><br/><font color\="red"><b>La modification d'un enum personnalisable peut nécessiter un redémarrage du serveur pour prendre effet.</b></font>
infoNoImmunizationAdverseEvents = Aucun événement indésirable n'a été créé pour cette immunisation
infoAefiSelectPrimarySuspectVaccine = La liste ci-dessous contient toutes les vaccinations de l'immunisation. Veuillez sélectionner la vaccination suspecte liée à cet événement indésirable.
infoArchivedAefiEntries = Les entrées d'événements indésirables sont automatiquement archivées après %d jours sans modification des données.
infoNoAefiInvestigations = Aucune enquête n'a été créée pour cet événement indésirable
infoHeadingAefiDashboardMap=Les événements indésirables sont affichés en utilisant les coordonnées GPS de l'établissement ou de l'adresse du domicile de la personne.
infoNoSurveys=Il n'y a aucune enquête créée ou envoyée pour ce cas
infoSurveyResponseReceived=Réponse reçue
infoSurveyResponseNotReceived=Aucune réponse reçue pour l'instant
infoNoDiseaseConfigurationAgeGroups=Cliquez sur le bouton + ci-dessous pour ajouter des groupes d'âges à cette configuration de maladie.
infoExternalMessageHospitalizationFacilityMissing=Le message externe contient une entrée d'hospitalisation sans nom d'hôpital.\nLe traitement peut continuer mais l'établissement hospitalier ne sera pas défini.
infoExternalMessageHospitalizationMissingHospital=Établissement hospitalier manquant pour l'hôpital '%s'.\nVeuillez contacter votre administrateur système pour configurer l'établissement hospitalier.

