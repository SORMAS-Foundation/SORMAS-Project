messageClinicalVisitsDeleted = All selected clinical visits have been deleted
messageCloneCaseWithNewDisease = Vous venez de créer un résultat de test pathogène positif pour une maladie différente. Voulez-vous que SORMAS génère automatiquement un nouveau cas avec cette nouvelle maladie? Toutes les informations de ce cas seront copiées dans le nouveau cas.
messageUpdateCaseWithNewDiseaseVariant = Vous avez sauvegardé un test pathogène positif d'une variante de maladie différente de la variante spécifiée dans le cas. Voulez-vous mettre à jour la variante de la maladie du cas ? La variante actuelle de l'épidémie du cas est %s, la variante de l'épidémie du test pathogène est %s.
messageCompletenessValuesUpdated = Les valeurs de complétude ont été mises à jour.
messageConfirmCaseAfterPathogenTest=Le résultat final de l’échantillon auquel appartient le test pathogène enregistré est positif. Cependant, le cas ne peut pas être automatiquement classé comme un cas confirmé car il manque certaines informations. Voulez-vous quand même définir la classification du cas comme confirmée ?
messageNegativeCaseAfterPathogenTest=Le résultat final de laboratoire de l'échantillon auquel appartient le test pathogène enregistré est négatif. Cependant, le cas ne peut pas être automatiquement classé comme non-cas car il manque certaines informations. Voulez-vous quand même définir la classification du cas comme non-cas ?
messageConvertContactToCase=Vous venez de sauvegarder un résultat de laboratoire positif pour la maladie du contact. Voulez-vous créer un cas pour la personne de contact ? Le cas sera défini comme le cas résultant de ce contact, et le résultat final du laboratoire de l'échantillon sera automatiquement positionné.
messageConvertContactToCaseDifferentDiseases=Vous venez d'enregistrer un résultat positif de laboratoire pour une maladie différente de la maladie du contact. Voulez-vous créer un cas avec cette maladie pour la personne de contact ? Le cas ne sera pas défini comme le cas résultant de ce contact.
messageConvertEventParticipantToCase=Vous venez de sauvegarder un résultat positif de laboratoire pour la maladie de l'événement. Voulez-vous créer un cas pour la personne participant à l'événement ? Le cas sera automatiquement lié au participant à l'événement, et le résultat final du laboratoire de l'échantillon sera positionné.
messageConvertEventParticipantToCaseDifferentDiseases=Vous venez de sauvegarder un résultat de laboratoire positif pour une maladie différente de la maladie de l'événement. Voulez-vous créer un cas avec cette maladie pour la personne participant à l'événement ? Le cas ne sera pas lié au participant à l'événement.
messageConvertEventParticipantToCaseNoDisease=Vous venez de sauvegarder un résultat de laboratoire positif pour un événement sans maladie. Voulez-vous créer un cas avec cette maladie pour la personne participant à l'événement ? Le résultat final du laboratoire de l'échantillon sera automatiquement positionné, mais le cas ne sera pas lié au participant à l'événement.
