#NotificationType
NotificationType.CASE_CLASSIFICATION_CHANGED = Classification de cas modifiée
NotificationType.Desc.CASE_CLASSIFICATION_CHANGED = Envoyé à tous les utilisateurs associés à la région ou à la région responsable d'un cas.
NotificationType.CASE_INVESTIGATION_DONE = Enquête de cas effectuée
NotificationType.Desc.CASE_INVESTIGATION_DONE = Envoyé à tous les utilisateurs associés à la région ou à la région responsable d'un cas.
NotificationType.EVENT_PARTICIPANT_CASE_CLASSIFICATION_CONFIRMED = Confirmation de la classification des cas des participants à l'événement
NotificationType.Desc.EVENT_PARTICIPANT_CASE_CLASSIFICATION_CONFIRMED = Lorsqu'un dossier est défini sur une classification confirmée, celle-ci est envoyée à tous les utilisateurs responsables des événements actifs auxquels la personne du dossier a participé et qui ont eu lieu au plus tôt 30 jours avant la classification du dossier.
NotificationType.EVENT_PARTICIPANT_RELATED_TO_OTHER_EVENTS = Participant à l'événement lié à d'autres événements
NotificationType.Desc.EVENT_PARTICIPANT_RELATED_TO_OTHER_EVENTS = Lorsqu'un nouveau participant à un événement est créé, celui-ci est envoyé à tous les utilisateurs responsables des événements actifs auxquels la personne a également participé et qui ont eu lieu au plus tôt 30 jours auparavant.
NotificationType.CASE_LAB_RESULT_ARRIVED = Le résultat du laboratoire de cas est arrivé
NotificationType.Desc.CASE_LAB_RESULT_ARRIVED = Envoyé à tous les utilisateurs associés à la région ou à la région responsable d'un cas lorsqu'un résultat de test d'agent pathogène est entré ou modifié (non en attente).
NotificationType.CONTACT_LAB_RESULT_ARRIVED = Le résultat du laboratoire de contact est arrivé
NotificationType.Desc.CONTACT_LAB_RESULT_ARRIVED = Envoyé à tous les utilisateurs associés à la région d'un contact lorsqu'un résultat de test pathogène est saisi ou modifié (non en attente). Si le contact n'a pas de région, la région du cas source est utilisée.
NotificationType.EVENT_PARTICIPANT_LAB_RESULT_ARRIVED = Le résultat du laboratoire des participants à l'événement est arrivé
NotificationType.Desc.EVENT_PARTICIPANT_LAB_RESULT_ARRIVED = Envoyé à tous les utilisateurs associés à la région d'un participant à l'événement lorsqu'un résultat de test d'agent pathogène est saisi ou modifié (non en attente).
NotificationType.LAB_SAMPLE_SHIPPED = Échantillon de laboratoire expédié
NotificationType.Desc.LAB_SAMPLE_SHIPPED = Envoyé à tous les utilisateurs d'un laboratoire lorsqu'un échantillon de ce laboratoire est expédié.
NotificationType.CONTACT_SYMPTOMATIC = symptomatique du contact
NotificationType.Desc.CONTACT_SYMPTOMATIC = Envoyé à tous les utilisateurs associés à la région d'un contact lorsqu'une nouvelle visite symptomatique est créée et que le contact était auparavant asymptomatique. Si le contact n'a pas de région, la région du cas source est utilisée.
NotificationType.TASK_START= Démarrage de la tâche
NotificationType.Desc.TASK_START= Envoyé au destinataire d'une tâche et à tous les utilisateurs observateurs lorsque la date de début de la tâche se situe dans les 10 dernières minutes.
NotificationType.TASK_DUE = Tâche due
NotificationType.Desc.TASK_DUE = Envoyé au destinataire d'une tâche et à tous les utilisateurs observateurs lorsque la date d'échéance de la tâche se situe dans les 10 dernières minutes.
NotificationType.TASK_UPDATED_ASSIGNEE = Destinataire de la tâche mis à jour
NotificationType.Desc.TASK_UPDATED_ASSIGNEE = Envoyé à l'ancien et au nouveau destinataire d'une tâche.
NotificationType.CONTACT_VISIT_COMPLETED = Visite de contact terminée
NotificationType.Desc.CONTACT_VISIT_COMPLETED = Envoyé à tous les utilisateurs associés à la région d'un contact et à tous les utilisateurs observateurs lorsqu'une tâche "Suivi de contact" est terminée. Si le contact n'a pas de région, la région du cas source est utilisée.
NotificationType.CASE_DISEASE_CHANGED = Maladie de cas modifiée
NotificationType.Desc.CASE_DISEASE_CHANGED = Envoyé à tous les utilisateurs associés à la région ou à la région responsable d'un cas lorsque la maladie était précédemment définie sur "VHF non spécifiée".
NotificationType.EVENT_GROUP_CREATED = Groupe d'événements créé
NotificationType.Desc.EVENT_GROUP_CREATED = Envoyé à tous les utilisateurs responsables des événements qui font partie d'un groupe d'événements nouvellement créé.
NotificationType.EVENT_ADDED_TO_EVENT_GROUP = Événement ajouté au groupe d'événements
NotificationType.Desc.EVENT_ADDED_TO_EVENT_GROUP = Envoyé à tous les utilisateurs responsables des événements qui font partie du groupe d'événements modifié.
NotificationType.EVENT_REMOVED_FROM_EVENT_GROUP = Événement retiré du groupe d'événements
NotificationType.Desc.EVENT_REMOVED_FROM_EVENT_GROUP = Envoyé à tous les utilisateurs responsables de l'événement supprimé et des événements faisant partie du groupe d'événements modifié.

